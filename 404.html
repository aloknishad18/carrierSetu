    <script type="text/javascript">
      // GitHub Pages SPA Routing Handler
      (function() {
        var pathSegments = window.location.pathname.split('/');
        var repoName = 'carrierSetu';
        var repoIndex = pathSegments.indexOf(repoName);
        if (repoIndex !== -1) {
          var routePath = '/' + pathSegments.slice(repoIndex + 1).join('/');
          if (routePath && routePath !== '/') {
            sessionStorage.setItem('gh_pages_redirect', routePath);
          }
        }
      })();
    </script>
